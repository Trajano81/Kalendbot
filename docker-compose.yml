services:
  waha:
    image: devlikeapro/waha:latest
    container_name: waha
    ports:
      - "3010:3000"
    environment:
      - WHATSAPP_DEFAULT_ENGINE=WEBJS
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME:-admin}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD}
      - WAHA_API_KEY=${WAHA_API_KEY}
      # Red interna: WAHA llama al container "kalendbot" directamente
      - WHATSAPP_HOOK_URL=http://kalendbot:8000/webhook/whatsapp
      - WHATSAPP_HOOK_EVENTS=message,session.status
    volumes:
      - ./waha-sessions:/app/.sessions
    restart: unless-stopped
    depends_on:
      - kalendbot

  kalendbot:
    build: .
    container_name: kalendbot
    # NO exponemos puerto 8000 al host — solo accesible dentro de Docker
    env_file:
      - .env
    environment:
      - KALENDBOT_DATA_DIR=/data
      # WAHA está en la red interna de Docker
      - WAHA_API_URL=http://waha:3000
    volumes:
      # Datos persistentes montados desde tu máquina
      - ./kalendbot-data:/data
    restart: unless-stopped
